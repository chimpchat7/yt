<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f12">
  <title>My Cartoons</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f12;
      --surface: #1a1a22;
      --surface2: #252530;
      --text: #f4f4f8;
      --muted: #9a9ab0;
      --accent: #ff6b6b;
      --accent2: #ffd93d;
      --green: #6bcb77;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 12px calc(20px + var(--safe-bottom));
    }

    header { text-align: center; padding: 6px 0 10px; }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

    /* Player stays fixed at top while list scrolls underneath */
    .player-sticky {
      position: -webkit-sticky;
      position: sticky;
      top: var(--safe-top);
      z-index: 50;
      background: var(--bg);
      padding: 8px 0 10px;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    }

    .player-wrap {
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .player-wrap.is-short {
      aspect-ratio: 9 / 16;
      max-height: min(55vh, 520px);
      margin: 0 auto;
      max-width: 320px;
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 16px;
      text-align: center;
      background: #000;
    }

    .player-placeholder .icon { font-size: 2.2rem; opacity: .75; }

    .player-error {
      color: var(--accent);
      font-size: 0.78rem;
      line-height: 1.4;
      max-width: 280px;
    }

    .now-playing {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 1.2em;
    }

    .scroll-body { padding-top: 4px; }

    .add-box {
      margin-top: 12px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
    }

    .add-box label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    .add-row input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--surface2);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    .add-row input:focus { border-color: var(--green); }

    .btn-save {
      background: var(--green);
      color: #0a1a0c;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-save:active { opacity: .85; }

    .msg { font-size: 0.8rem; margin-top: 8px; min-height: 1.2em; }
    .msg.ok { color: var(--green); }
    .msg.err { color: var(--accent); }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 16px 0 10px;
    }

    .video-list { display: flex; flex-direction: column; gap: 8px; }

    .video-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      border: 2px solid transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    .video-item:active { transform: scale(.985); }
    .video-item.active { border-color: var(--accent2); background: var(--surface2); }

    .video-item .thumb {
      width: 72px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .video-item .info { flex: 1; min-width: 0; }

    .video-item .title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item .meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .btn-del {
      background: var(--surface2);
      border: none;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    #savedStore { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎬 My Cartoons</h1>
      <p>Paste link → Save → tap to play</p>
    </header>

    <div class="player-sticky">
      <div class="player-wrap" id="playerWrap">
        <div class="player-placeholder" id="placeholder">
          <span class="icon">▶️</span>
          <span>Tap a video below</span>
          <span class="player-error" id="playerError" hidden></span>
        </div>
        <iframe
          id="player"
          title="Video player"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>
      <div class="now-playing" id="nowPlaying">&nbsp;</div>
    </div>

    <div class="scroll-body">
      <div class="add-box">
        <label for="urlInput">YouTube or Shorts link</label>
        <div class="add-row">
          <input type="url" id="urlInput" placeholder="Paste link…" autocomplete="off">
          <button type="button" class="btn-save" id="saveBtn">Save</button>
        </div>
        <div class="msg" id="addMsg"></div>
      </div>

      <div class="section-title">Saved videos (<span id="count">0</span>)</div>
      <div class="video-list" id="videoList"></div>
      <div class="empty" id="emptyState" hidden>
        No videos yet.<br>Paste a link and tap Save.
      </div>
    </div>
  </div>

  <textarea id="savedStore"></textarea>

  <script>
    (function () {
      var videos = [];
      var currentId = null;
      var isFilePage = location.protocol === 'file:';

      var playerWrap = document.getElementById('playerWrap');
      var player = document.getElementById('player');
      var placeholder = document.getElementById('placeholder');
      var playerError = document.getElementById('playerError');
      var nowPlaying = document.getElementById('nowPlaying');
      var videoList = document.getElementById('videoList');
      var emptyState = document.getElementById('emptyState');
      var countEl = document.getElementById('count');
      var savedStore = document.getElementById('savedStore');
      var urlInput = document.getElementById('urlInput');
      var saveBtn = document.getElementById('saveBtn');
      var addMsg = document.getElementById('addMsg');

      function pageOrigin() {
        if (location.protocol === 'http:' || location.protocol === 'https:') {
          return location.origin;
        }
        return '';
      }

      function extractVideoId(url) {
        if (!url || typeof url !== 'string') return null;
        var u = url.trim();
        var patterns = [
          /(?:youtube\.com\/watch\?(?:.*&)?v=|youtube\.com\/watch\?v=)([\w-]{11})/i,
          /youtu\.be\/([\w-]{11})/i,
          /youtube\.com\/shorts\/([\w-]{11})/i,
          /youtube\.com\/embed\/([\w-]{11})/i,
          /youtube\.com\/live\/([\w-]{11})/i,
          /m\.youtube\.com\/watch\?(?:.*&)?v=([\w-]{11})/i
        ];
        for (var i = 0; i < patterns.length; i++) {
          var m = u.match(patterns[i]);
          if (m) return m[1];
        }
        return null;
      }

      function isShortUrl(url) {
        return (url || '').indexOf('/shorts/') >= 0;
      }

      function parseLine(line) {
        line = (line || '').trim();
        if (!line) return null;
        var url = line.split('|')[0].trim();
        var id = extractVideoId(url);
        if (!id) return null;
        return { id: id, url: url };
      }

      function readFromPage() {
        var lines = savedStore.value.split('\n');
        var list = [];
        var seen = {};
        lines.forEach(function (line) {
          var v = parseLine(line);
          if (v && !seen[v.id]) {
            seen[v.id] = true;
            list.push(v);
          }
        });
        videos = list;
      }

      function writeToPage() {
        savedStore.value = videos.map(function (v) { return v.url; }).join('\n');
      }

      function thumbUrl(id) {
        return 'https://img.youtube.com/vi/' + id + '/mqdefault.jpg';
      }

      function embedUrl(id) {
        var parts = [
          'autoplay=1',
          'playsinline=1',
          'rel=0',
          'modestbranding=1',
          'fs=1',
          'iv_load_policy=3'
        ];
        var origin = pageOrigin();
        if (origin) parts.push('origin=' + encodeURIComponent(origin));
        return 'https://www.youtube.com/embed/' + id + '?' + parts.join('&');
      }

      function showError(msg) {
        playerError.textContent = msg;
        playerError.hidden = false;
        placeholder.style.display = 'flex';
        player.style.display = 'none';
        player.removeAttribute('src');
      }

      function clearError() {
        playerError.hidden = true;
        playerError.textContent = '';
      }

      function playVideo(id, url, label) {
        if (isFilePage) {
          showError('Open on GitHub Pages or localhost — not as a saved file.');
          return;
        }

        currentId = id;
        playerWrap.classList.toggle('is-short', isShortUrl(url));
        nowPlaying.textContent = label || (isShortUrl(url) ? 'Short' : 'Video');
        clearError();
        renderList();

        placeholder.style.display = 'none';
        player.style.display = 'block';
        player.referrerPolicy = 'strict-origin-when-cross-origin';

        var nextSrc = embedUrl(id);
        if (player.src !== nextSrc) {
          player.src = nextSrc;
        }
      }

      function stopPlayer() {
        player.removeAttribute('src');
        player.style.display = 'none';
        placeholder.style.display = 'flex';
        playerWrap.classList.remove('is-short');
        nowPlaying.innerHTML = '&nbsp;';
        currentId = null;
        clearError();
      }

      function renderList() {
        countEl.textContent = String(videos.length);
        videoList.innerHTML = '';

        if (!videos.length) {
          emptyState.hidden = false;
          stopPlayer();
          return;
        }
        emptyState.hidden = true;

        videos.forEach(function (v, idx) {
          var item = document.createElement('div');
          item.className = 'video-item' + (v.id === currentId ? ' active' : '');

          var img = document.createElement('img');
          img.className = 'thumb';
          img.src = thumbUrl(v.id);
          img.alt = '';
          img.loading = 'lazy';

          var info = document.createElement('div');
          info.className = 'info';
          var t = document.createElement('div');
          t.className = 'title';
          t.textContent = isShortUrl(v.url) ? ('Short ' + (idx + 1)) : ('Video ' + (idx + 1));
          var meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = 'Tap to play';
          info.appendChild(t);
          info.appendChild(meta);

          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'btn-del';
          del.textContent = 'Delete';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            removeVideo(idx);
          });

          item.appendChild(img);
          item.appendChild(info);
          item.appendChild(del);
          item.addEventListener('click', function () {
            playVideo(v.id, v.url, t.textContent);
          });

          videoList.appendChild(item);
        });
      }

      function saveVideo() {
        addMsg.className = 'msg';
        addMsg.textContent = '';
        var url = urlInput.value.trim();
        var id = extractVideoId(url);
        if (!id) {
          addMsg.className = 'msg err';
          addMsg.textContent = 'Bad link. Paste a full YouTube or Shorts URL.';
          return;
        }
        if (videos.some(function (v) { return v.id === id; })) {
          addMsg.className = 'msg err';
          addMsg.textContent = 'Already saved.';
          return;
        }
        videos.push({ id: id, url: url });
        writeToPage();
        urlInput.value = '';
        addMsg.className = 'msg ok';
        addMsg.textContent = 'Saved! Playing…';
        renderList();
        playVideo(id, url);
      }

      function removeVideo(idx) {
        var removed = videos[idx];
        videos.splice(idx, 1);
        writeToPage();
        if (removed && removed.id === currentId) stopPlayer();
        renderList();
      }

      saveBtn.addEventListener('click', saveVideo);
      urlInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') saveVideo();
      });

      readFromPage();
      renderList();
    })();
  </script>
</body>
</html>
