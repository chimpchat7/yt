  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0c; --surface: #16161c; --text: #f4f4f8; --muted: #888;
      --accent: #ff5c5c; --green: #5ecf7a;
      --strip-h: 54px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100%; overflow: hidden;
      background: #000; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      display: flex; flex-direction: column;
      height: 100dvh; height: 100vh;
      max-width: 640px; margin: 0 auto;
    }

    .player-area {
      flex: 1; min-height: 0; background: #000; position: relative;
      display: flex; flex-direction: column;
    }
    .player-wrap {
      flex: 1; min-height: 0; width: 100%; position: relative; background: #000;
    }
    .player-wrap.is-short {
      display: flex; align-items: center; justify-content: center;
    }
    .player-wrap.is-short #playerSlot {
      width: auto; height: 100%; max-width: 100%; aspect-ratio: 9/16;
      position: relative; inset: auto;
    }
    #playerSlot { position: absolute; inset: 0; }
    #playerSlot iframe { width: 100%; height: 100%; border: 0; }
    .player-placeholder {
      position: absolute; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.8rem; padding: 12px; text-align: center;
    }
    .player-error { color: var(--accent); font-size: 0.76rem; line-height: 1.4; }

    .player-controls {
      display: none; position: absolute; inset: 0; z-index: 30;
      pointer-events: none;
    }
    .player-controls.visible { display: block; }
    .btn-del-video {
      display: block; position: absolute;
      top: calc(6px + env(safe-area-inset-top, 0px));
      right: calc(6px + env(safe-area-inset-right, 0px));
      width: 18px; height: 18px; line-height: 16px; text-align: center;
      background: rgba(0,0,0,.6); color: #ff8a8a; border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%; font-size: 0.55rem; font-weight: 700; cursor: pointer; padding: 0;
      pointer-events: auto;
    }
    @media (pointer: coarse) {
      .btn-del-video { width: 28px; height: 28px; line-height: 26px; font-size: 0.65rem; }
      :root { --strip-h: 58px; }
      .btn-add { width: 44px; height: 44px; }
    }

    .btn-stop {
      display: none; position: absolute; bottom: 10px; right: 10px; z-index: 20;
      background: rgba(0,0,0,.65); color: #fff; border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px; padding: 7px 12px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
    }
    .btn-stop.visible { display: block; }

    .bottom {
      flex-shrink: 0; background: var(--bg);
      padding-bottom: var(--safe-b);
      border-top: 1px solid #222;
      position: relative; z-index: 40;
    }

    .thumb-strip {
      display: flex; flex-wrap: nowrap; gap: 8px; padding: 6px 8px;
      height: var(--strip-h); min-height: var(--strip-h);
      overflow-x: auto; overflow-y: hidden;
      align-items: center;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }
    .thumb-strip::-webkit-scrollbar { height: 3px; }
    .thumb-strip::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .btn-add {
      flex-shrink: 0; width: 40px; height: 40px;
      background: var(--surface); border: 1px dashed #444; border-radius: 8px;
      color: var(--green); font-size: 1.4rem; font-weight: 300; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-add:active { background: #222; }

    .thumb-btn {
      flex-shrink: 0; width: 64px; height: 40px; padding: 0;
      border: 2px solid transparent; border-radius: 6px;
      overflow: hidden; cursor: pointer; background: #222;
    }
    .thumb-btn.active { border-color: #ffd93d; }
    .thumb-btn img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      background: #333;
    }
    .thumb-btn .thumb-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; color: #666; background: #222;
    }

    .empty-strip {
      color: var(--muted); font-size: 0.72rem; padding: 0 4px; white-space: nowrap;
    }

    /* Add sheet — hidden until + tapped */
    .add-backdrop {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.6);
    }
    .add-backdrop.open { display: block; }
    .add-sheet {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 101;
      background: var(--bg); border-top: 1px solid #333;
      padding: 12px 12px calc(12px + var(--safe-b));
      max-width: 640px; margin: 0 auto;
    }
    .add-sheet.open { display: block; }
    .add-sheet .row { display: flex; gap: 8px; }
    .add-sheet input {
      flex: 1; min-width: 0; background: var(--surface); border: none;
      border-radius: 10px; color: var(--text); padding: 12px; font-size: 0.9rem; outline: none;
    }
    .add-sheet .btn-save {
      background: var(--green); color: #0a1a0c; border: none;
      border-radius: 10px; padding: 0 18px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
    }
    .add-sheet .btn-cancel {
      margin-top: 10px; width: 100%; background: none; border: none;
      color: var(--muted); font-size: 0.82rem; padding: 8px; cursor: pointer;
    }
    .msg { font-size: 0.72rem; margin-top: 8px; min-height: 1em; }
    .msg.ok { color: var(--green); }
    .msg.err { color: var(--accent); }

    #savedStore { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="player-area">
      <div class="player-wrap" id="playerWrap">
        <div class="player-placeholder" id="placeholder">
          <span class="player-error" id="playerError" hidden></span>
        </div>
        <div id="playerSlot"></div>
        <div class="player-controls" id="playerControls">
          <button type="button" class="btn-del-video" id="delVideoBtn" title="Remove this video">✕</button>
        </div>
        <button type="button" class="btn-stop" id="stopBtn">Stop</button>
      </div>
    </div>

    <div class="bottom">
      <div class="thumb-strip" id="thumbStrip">
        <button type="button" class="btn-add" id="openAddBtn" title="Add video">+</button>
        <span class="empty-strip" id="emptyStrip">Tap + to add</span>
      </div>
    </div>
  </div>

  <div class="add-backdrop" id="addBackdrop"></div>
  <div class="add-sheet" id="addSheet">
    <div class="row">
      <input type="text" id="urlInput" placeholder="Paste YouTube link…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="url">
      <button type="button" class="btn-save" id="saveBtn">Save</button>
    </div>
    <div class="msg" id="addMsg"></div>
    <button type="button" class="btn-cancel" id="cancelAddBtn">Cancel</button>
  </div>

  <textarea id="savedStore"></textarea>

  <script>
    (function () {
      var STORAGE_KEY = 'localyt_videos';
      var HASH_PREFIX = '#u=';
      var videos = [];
      var currentId = null;
      var isFilePage = location.protocol === 'file:';

      var playerWrap = document.getElementById('playerWrap');
      var playerSlot = document.getElementById('playerSlot');
      var placeholder = document.getElementById('placeholder');
      var playerError = document.getElementById('playerError');
      var playerControls = document.getElementById('playerControls');
      var delVideoBtn = document.getElementById('delVideoBtn');
      var stopBtn = document.getElementById('stopBtn');
      var thumbStrip = document.getElementById('thumbStrip');
      var emptyStrip = document.getElementById('emptyStrip');
      var openAddBtn = document.getElementById('openAddBtn');
      var addBackdrop = document.getElementById('addBackdrop');
      var addSheet = document.getElementById('addSheet');
      var urlInput = document.getElementById('urlInput');
      var saveBtn = document.getElementById('saveBtn');
      var cancelAddBtn = document.getElementById('cancelAddBtn');
      var addMsg = document.getElementById('addMsg');
      var savedStore = document.getElementById('savedStore');

      function extractVideoId(url) {
        if (!url) return null;
        var u = String(url).trim();
        var patterns = [
          /(?:youtube\.com\/watch\?(?:.*&)?v=|youtube\.com\/watch\?v=)([\w-]{11})/i,
          /m\.youtube\.com\/watch\?(?:.*&)?v=([\w-]{11})/i,
          /youtu\.be\/([\w-]{11})/i,
          /youtube\.com\/shorts\/([\w-]{11})/i,
          /m\.youtube\.com\/shorts\/([\w-]{11})/i,
          /youtube\.com\/embed\/([\w-]{11})/i,
          /youtube\.com\/live\/([\w-]{11})/i
        ];
        for (var i = 0; i < patterns.length; i++) {
          var m = u.match(patterns[i]);
          if (m) return m[1];
        }
        return null;
      }

      function isShortUrl(url) { return /\/shorts\//i.test(url || ''); }

      function normalizeList(list) {
        var out = [], seen = {};
        (list || []).forEach(function (item) {
          var url = typeof item === 'string' ? item : (item && item.url);
          if (!url) return;
          url = String(url).trim();
          var id = extractVideoId(url);
          if (!id || seen[id]) return;
          seen[id] = true;
          out.push({ id: id, url: url });
        });
        return out;
      }

      function loadFromHash() {
        if (location.hash.indexOf(HASH_PREFIX) !== 0) return [];
        try {
          return normalizeList(location.hash.slice(HASH_PREFIX.length).split('~').map(decodeURIComponent));
        } catch (e) { return []; }
      }

      function updateHash() {
        if (!videos.length) {
          history.replaceState(null, '', location.pathname + location.search);
          return;
        }
        history.replaceState(null, '', HASH_PREFIX + videos.map(function (v) {
          return encodeURIComponent(v.url);
        }).join('~'));
      }

      function persistVideos() {
        if (savedStore) savedStore.value = videos.map(function (v) { return v.url; }).join('\n');
        updateHash();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(videos)); } catch (e) {}
      }

      function loadVideos() {
        var merged = [];
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) merged = merged.concat(JSON.parse(raw));
        } catch (e) {}
        merged = merged.concat(loadFromHash());
        if (savedStore && savedStore.value.trim()) merged = merged.concat(savedStore.value.split('\n'));
        videos = normalizeList(merged);
        if (videos.length) persistVideos();
      }

      function pageOrigin() {
        return (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin : '';
      }

      function embedUrl(id) {
        var p = ['autoplay=1', 'playsinline=1', 'rel=0', 'modestbranding=1', 'enablejsapi=1', 'fs=1'];
        var o = pageOrigin();
        if (o) p.push('origin=' + encodeURIComponent(o));
        return 'https://www.youtube.com/embed/' + id + '?' + p.join('&');
      }

      function setPlayingUi(on) {
        stopBtn.classList.toggle('visible', on);
        playerControls.classList.toggle('visible', on);
      }

      function attachThumbImg(img, id) {
        var tries = [
          'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg',
          'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg',
          'https://img.youtube.com/vi/' + id + '/default.jpg'
        ];
        var n = 0;
        img.onerror = function () {
          n++;
          if (n < tries.length) img.src = tries[n];
          else {
            img.style.display = 'none';
            var fb = img.parentElement.querySelector('.thumb-fallback');
            if (fb) fb.style.display = 'flex';
          }
        };
        img.src = tries[0];
      }

      function pausePlayer() {
        var iframe = playerSlot.querySelector('iframe');
        if (!iframe) return;
        try {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        } catch (_) {}
      }

      function destroyPlayer() {
        var iframe = playerSlot.querySelector('iframe');
        if (iframe) {
          try {
            iframe.contentWindow.postMessage('{"event":"command","func":"stopVideo","args":""}', '*');
          } catch (_) {}
          iframe.src = 'about:blank';
        }
        playerSlot.innerHTML = '';
        placeholder.style.display = 'flex';
        setPlayingUi(false);
        playerWrap.classList.remove('is-short');
        currentId = null;
        playerError.hidden = true;
      }

      function playVideo(item) {
        if (isFilePage) {
          playerError.textContent = 'Use http://YOUR-PC-IP:4567/localyt.html on phone (same WiFi), or GitHub Pages — not a saved file.';
          playerError.hidden = false;
          return;
        }
        if (currentId === item.id && playerSlot.querySelector('iframe')) {
          destroyPlayer();
          renderThumbs();
          return;
        }
        destroyPlayer();
        currentId = item.id;
        playerWrap.classList.toggle('is-short', isShortUrl(item.url));
        setPlayingUi(true);
        playerError.hidden = true;
        renderThumbs();

        var iframe = document.createElement('iframe');
        iframe.title = 'Player';
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        iframe.src = embedUrl(item.id);
        placeholder.style.display = 'none';
        playerSlot.appendChild(iframe);
      }

      function deleteCurrentVideo() {
        if (!currentId) return;
        var idx = -1;
        for (var i = 0; i < videos.length; i++) {
          if (videos[i].id === currentId) { idx = i; break; }
        }
        destroyPlayer();
        if (idx >= 0) {
          videos.splice(idx, 1);
          persistVideos();
        }
        renderThumbs();
      }

      function renderThumbs() {
        var addBtn = openAddBtn;
        thumbStrip.innerHTML = '';
        thumbStrip.appendChild(addBtn);
        emptyStrip.hidden = videos.length > 0;

        videos.forEach(function (v) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumb-btn' + (v.id === currentId ? ' active' : '');
          var img = document.createElement('img');
          img.alt = '';
          img.loading = 'lazy';
          var fb = document.createElement('span');
          fb.className = 'thumb-fallback';
          fb.textContent = '▶';
          fb.style.display = 'none';
          attachThumbImg(img, v.id);
          btn.appendChild(img);
          btn.appendChild(fb);
          btn.addEventListener('click', function () { playVideo(v); });
          thumbStrip.appendChild(btn);
        });

        if (!videos.length) thumbStrip.appendChild(emptyStrip);
      }

      function openAddSheet() {
        addBackdrop.classList.add('open');
        addSheet.classList.add('open');
        addMsg.textContent = '';
        urlInput.value = '';
        setTimeout(function () { urlInput.focus(); }, 100);
      }

      function closeAddSheet() {
        addBackdrop.classList.remove('open');
        addSheet.classList.remove('open');
      }

      function saveVideo() {
        addMsg.className = 'msg';
        addMsg.textContent = '';
        var url = urlInput.value.trim();
        var id = extractVideoId(url);
        if (!id) {
          addMsg.className = 'msg err';
          addMsg.textContent = 'Bad link.';
          return;
        }
        if (videos.some(function (v) { return v.id === id; })) {
          addMsg.className = 'msg err';
          addMsg.textContent = 'Already added.';
          return;
        }
        videos.push({ id: id, url: url });
        persistVideos();
        closeAddSheet();
        renderThumbs();
        playVideo(videos[videos.length - 1]);
      }

      openAddBtn.addEventListener('click', openAddSheet);
      cancelAddBtn.addEventListener('click', closeAddSheet);
      addBackdrop.addEventListener('click', closeAddSheet);
      saveBtn.addEventListener('click', saveVideo);
      urlInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') saveVideo();
      });
      stopBtn.addEventListener('click', function () {
        destroyPlayer();
        renderThumbs();
      });
      delVideoBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteCurrentVideo();
      });

      window.addEventListener('pagehide', destroyPlayer);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) pausePlayer();
      });

      loadVideos();
      renderThumbs();
    })();
  </script>
</body>
</html>
