<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f12">
  <title>Learn — Age 4</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f12; --surface: #1a1a22; --surface2: #252530;
      --text: #f4f4f8; --muted: #9a9ab0; --accent: #ff6b6b;
      --accent2: #ffd93d; --green: #6bcb77; --blue: #5b9fd4;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .app { max-width: 640px; margin: 0 auto; padding: 0 8px calc(16px + var(--safe-bottom)); }
    .parent-btn {
      position: absolute; right: 8px; top: 8px; z-index: 60;
      background: rgba(0,0,0,.55); border: none; color: #fff;
      font-size: 1rem; padding: 6px 9px; border-radius: 8px; cursor: pointer;
    }
    .player-sticky {
      position: -webkit-sticky; position: sticky; top: 0; z-index: 50;
      background: var(--bg); padding: 0; margin: 0 -8px 6px;
      padding-left: 8px; padding-right: 8px;
    }
    .player-wrap {
      background: #000; border-radius: 10px; overflow: hidden;
      width: 100%; aspect-ratio: 16/9; position: relative;
    }
    .player-wrap.is-short { aspect-ratio: 9/16; max-height: 72vh; margin: 0 auto; max-width: 340px; }
    #playerSlot { position: absolute; inset: 0; }
    #playerSlot iframe { width: 100%; height: 100%; border: 0; }
    .player-placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: var(--muted); font-size: 0.85rem; padding: 16px; text-align: center;
      background: #000; z-index: 1;
    }
    .player-placeholder .icon { font-size: 1.6rem; opacity: .5; }
    .player-error { color: var(--accent); font-size: 0.76rem; line-height: 1.4; max-width: 280px; }
    .now-row { display: none; align-items: center; gap: 8px; margin-top: 6px; }
    .now-row.visible { display: flex; }
    .now-playing { flex: 1; font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-stop {
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 6px 12px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
      flex-shrink: 0;
    }
    .edu-badge {
      display: inline-block; background: #1a3a2a; color: var(--green);
      font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
      margin-left: 6px; vertical-align: middle;
    }
    .panel {
      background: var(--surface); border-radius: var(--radius);
      padding: 14px; margin-top: 12px;
    }
    .panel h2 { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; }
    .row input, .panel input[type="text"], .panel input[type="password"], .panel input[type="url"] {
      flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--surface2);
      border-radius: 10px; color: var(--text); padding: 11px 12px; font-size: 0.92rem; outline: none;
    }
    .row input:focus, .panel input:focus { border-color: var(--green); }
    .btn {
      border: none; border-radius: 10px; padding: 0 16px; font-weight: 700;
      font-size: 0.85rem; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .btn-green { background: var(--green); color: #0a1a0c; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn:active { opacity: .85; }
    .msg { font-size: 0.78rem; margin-top: 8px; min-height: 1.2em; line-height: 1.4; }
    .msg.ok { color: var(--green); } .msg.err { color: var(--accent); } .msg.info { color: var(--muted); }
    .section-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin: 14px 0 8px;
    }
    .video-list { display: flex; flex-direction: column; gap: 8px; }
    .video-item {
      display: flex; align-items: center; gap: 10px; background: var(--surface);
      border-radius: 12px; padding: 9px 10px; cursor: pointer;
      border: 2px solid transparent; -webkit-user-select: none; user-select: none;
    }
    .video-item:active { transform: scale(.985); }
    .video-item.active { border-color: var(--accent2); background: var(--surface2); }
    .video-item .thumb {
      width: 68px; height: 46px; border-radius: 8px; object-fit: cover;
      background: var(--surface2); flex-shrink: 0;
    }
    .video-item .info { flex: 1; min-width: 0; }
    .video-item .title { font-size: 0.84rem; font-weight: 600; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-item .meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .btn-del, .btn-add {
      background: var(--surface2); border: none; font-size: 0.74rem; font-weight: 700;
      padding: 7px 10px; border-radius: 8px; cursor: pointer; flex-shrink: 0;
    }
    .btn-del { color: var(--accent); }
    .btn-add { color: var(--green); }
    .empty { text-align: center; padding: 24px 12px; color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
    .parent-panel { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface2); }
    .parent-panel.open { display: block; }
    .parent-panel label { display: block; font-size: 0.72rem; color: var(--muted); margin: 8px 0 4px; }
    .hint { font-size: 0.7rem; color: var(--muted); line-height: 1.45; margin-top: 8px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      background: var(--surface2); border: none; color: var(--text);
      font-size: 0.82rem; padding: 10px 14px; border-radius: 20px; cursor: pointer;
    }
    .chip:active { background: var(--blue); }
    #savedStore { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="player-sticky">
      <div class="player-wrap" id="playerWrap">
        <button type="button" class="parent-btn" id="parentBtn" title="Parent">⚙️</button>
        <div class="player-placeholder" id="placeholder">
          <span class="player-error" id="playerError" hidden></span>
        </div>
        <div id="playerSlot"></div>
      </div>
      <div class="now-row" id="nowRow">
        <div class="now-playing" id="nowPlaying">&nbsp;</div>
        <button type="button" class="btn-stop" id="stopBtn">Stop</button>
      </div>
    </div>

    <div class="panel">
      <h2>🔍 Find videos (age 4)</h2>
      <div class="row">
        <input type="text" id="searchInput" placeholder="e.g. ABC, colours, farm animals…" autocomplete="off">
        <button type="button" class="btn btn-blue" id="searchBtn">Search</button>
      </div>
      <div class="chip-row" id="chipRow"></div>
      <div class="msg" id="searchMsg"></div>
    </div>

    <div class="section-title">Search results</div>
    <div class="video-list" id="searchList"></div>
    <div class="empty" id="searchEmpty">Tap a picture-word below or search — only age-4 style videos.</div>

    <div class="section-title">My saved videos (<span id="count">0</span>)</div>
    <div class="video-list" id="videoList"></div>
    <div class="empty" id="emptyState" hidden>No saved videos yet.</div>

    <div class="panel" id="parentPanel" style="margin-top:14px">
      <h2>👨‍👩‍👧 Parent settings</h2>
      <div id="pinGate">
        <label>PIN (default 1234)</label>
        <div class="row">
          <input type="password" id="pinInput" inputmode="numeric" maxlength="8" placeholder="PIN">
          <button type="button" class="btn btn-green" id="pinBtn">Unlock</button>
        </div>
      </div>
      <div id="parentBody" class="parent-panel">
        <label for="apiKeyInput">YouTube API key (for search)</label>
        <input type="text" id="apiKeyInput" placeholder="AIza…" autocomplete="off">
        <p class="hint">Free from Google Cloud Console → enable YouTube Data API v3. Stored on this phone only.</p>
        <button type="button" class="btn btn-green" id="saveKeyBtn" style="margin-top:10px;width:100%;padding:12px">Save API key</button>
        <label style="margin-top:14px">Add any link manually (skip education filter)</label>
        <div class="row" style="margin-top:4px">
          <input type="url" id="urlInput" placeholder="Paste YouTube link…">
          <button type="button" class="btn btn-green" id="saveBtn">Add</button>
        </div>
        <div class="msg" id="addMsg"></div>
      </div>
    </div>
  </div>

  <textarea id="savedStore"></textarea>

  <script>
    (function () {
      var STORAGE_KEY = 'localyt_videos';
      var API_KEY_STORAGE = 'localyt_yt_api';
      var PIN_KEY = 'localyt_pin';
      var DEFAULT_PIN = '1234';
      var HASH_PREFIX = '#u=';

      /* Age-4 / preschool signals — search results need at least one */
      var AGE4_WORDS = [
        'baby', 'toddler', 'toddlers', 'preschool', 'pre-school', 'nursery', 'lkg', 'ukg', 'kg',
        'kindergarten', '4 year', '3 year', '5 year', 'years old', 'little kids', 'for kids',
        'rhyme', 'rhymes', 'lullaby', 'sing along', 'sing-along', 'cocomelon', 'chu chu',
        'super simple', 'pinkfong', 'baby shark', 'cartoon', 'animated', 'animation',
        'abc', 'alphabet', 'phonics', '123', 'counting', '1 to 10', '1-10', 'numbers',
        'colors', 'colours', 'shapes', 'circle', 'square', 'animal', 'animals', 'farm',
        'duck', 'cow', 'cat', 'dog', 'lion', 'elephant', 'fruit', 'vegetable', 'body parts',
        'good habit', 'manners', 'sharing', 'friend', 'potty', 'brush teeth', 'wash hands',
        'story', 'stories', 'fairy', 'moral', 'bedtime', 'learn', 'learning', 'educational',
        'opposites', 'big and small', 'up and down', 'finger family', 'wheels on the bus',
        'old macdonald', 'baa baa', 'twinkle', 'humpty', 'jack and jill', 'bal geet', 'balgeet',
        'hindi rhyme', 'nursery hindi', 'चूहा', 'कविता', 'rhymes hindi'
      ];

      var EDU_WORDS = AGE4_WORDS.concat([
        'kids', 'kid', 'children', 'child', 'junior', 'song', 'songs', 'music', 'drawing'
      ]);

      var BLOCK_WORDS = [
        'gaming', 'gameplay', 'fortnite', 'minecraft', 'roblox', 'prank', 'vlog', 'unboxing',
        'makeup', 'dating', 'horror', 'scary', 'ghost', 'fight', 'fighting', 'wrestling',
        'wwe', 'gun', 'weapon', 'war', 'kill', 'blood', 'zombie', 'news', 'trailer',
        'movie review', 'bollywood', 'reels', 'tiktok', 'challenge', 'teen', 'teenager',
        'grade 1', 'grade 2', 'grade 3', 'class 5', 'class 6', 'class 7', 'exam', 'homework',
        'jee', 'neet', 'calculus', 'algebra', 'physics', 'chemistry', 'biology class',
        'high school', 'middle school', 'college', 'lecture', 'tutorial class'
      ];

      var QUICK_SEARCH = [
        { label: '🔤 ABC', q: 'ABC alphabet song preschool toddlers' },
        { label: '🔢 1-10', q: 'counting 1 to 10 nursery rhyme toddlers' },
        { label: '🎨 Colours', q: 'learn colors for toddlers preschool' },
        { label: '⭕ Shapes', q: 'shapes circle square preschool toddlers' },
        { label: '🐄 Animals', q: 'farm animals sounds toddlers preschool' },
        { label: '🚌 Rhymes', q: 'wheels on the bus nursery rhyme toddlers' },
        { label: '😊 Habits', q: 'good habits brush teeth kids preschool' },
        { label: '📖 Stories', q: 'moral stories cartoon preschool bedtime' }
      ];

      var SEARCH_SUFFIX = 'for 4 year old preschool toddler nursery';

      var videos = [];
      var searchResults = [];
      var currentId = null;
      var parentOpen = false;
      var isFilePage = location.protocol === 'file:';

      var playerWrap = document.getElementById('playerWrap');
      var playerSlot = document.getElementById('playerSlot');
      var placeholder = document.getElementById('placeholder');
      var playerError = document.getElementById('playerError');
      var nowPlaying = document.getElementById('nowPlaying');
      var nowRow = document.getElementById('nowRow');
      var stopBtn = document.getElementById('stopBtn');
      var videoList = document.getElementById('videoList');
      var searchList = document.getElementById('searchList');
      var emptyState = document.getElementById('emptyState');
      var searchEmpty = document.getElementById('searchEmpty');
      var countEl = document.getElementById('count');
      var searchInput = document.getElementById('searchInput');
      var searchBtn = document.getElementById('searchBtn');
      var searchMsg = document.getElementById('searchMsg');
      var chipRow = document.getElementById('chipRow');
      var parentBtn = document.getElementById('parentBtn');
      var parentPanel = document.getElementById('parentPanel');
      var pinGate = document.getElementById('pinGate');
      var parentBody = document.getElementById('parentBody');
      var pinInput = document.getElementById('pinInput');
      var pinBtn = document.getElementById('pinBtn');
      var apiKeyInput = document.getElementById('apiKeyInput');
      var saveKeyBtn = document.getElementById('saveKeyBtn');
      var urlInput = document.getElementById('urlInput');
      var saveBtn = document.getElementById('saveBtn');
      var addMsg = document.getElementById('addMsg');
      var savedStore = document.getElementById('savedStore');

      function getPin() {
        try { return localStorage.getItem(PIN_KEY) || DEFAULT_PIN; } catch (e) { return DEFAULT_PIN; }
      }

      function getApiKey() {
        try { return (localStorage.getItem(API_KEY_STORAGE) || '').trim(); } catch (e) { return ''; }
      }

      function saveApiKey() {
        try {
          localStorage.setItem(API_KEY_STORAGE, apiKeyInput.value.trim());
          searchMsg.className = 'msg ok';
          searchMsg.textContent = 'API key saved.';
        } catch (e) {
          searchMsg.className = 'msg err';
          searchMsg.textContent = 'Could not save API key.';
        }
      }

      function extractVideoId(url) {
        if (!url) return null;
        var u = String(url).trim();
        var patterns = [
          /(?:youtube\.com\/watch\?(?:.*&)?v=|youtube\.com\/watch\?v=)([\w-]{11})/i,
          /youtu\.be\/([\w-]{11})/i,
          /youtube\.com\/shorts\/([\w-]{11})/i,
          /m\.youtube\.com\/shorts\/([\w-]{11})/i,
          /youtube\.com\/embed\/([\w-]{11})/i
        ];
        for (var i = 0; i < patterns.length; i++) {
          var m = u.match(patterns[i]);
          if (m) return m[1];
        }
        return null;
      }

      function isShortUrl(url) {
        return /\/shorts\//i.test(url || '');
      }

      function textHasWord(list, text) {
        var t = (text || '').toLowerCase();
        for (var i = 0; i < list.length; i++) {
          if (t.indexOf(list[i]) >= 0) return true;
        }
        return false;
      }

      function textHasEduWord(text) { return textHasWord(EDU_WORDS, text); }
      function textHasAge4Word(text) { return textHasWord(AGE4_WORDS, text); }
      function textHasBlockWord(text) { return textHasWord(BLOCK_WORDS, text); }

      /* Stricter filter for age 4 — must look preschool, not school-age */
      function isEducationVideo(meta) {
        var blob = ((meta.title || '') + ' ' + (meta.channel || '') + ' ' + (meta.description || '')).toLowerCase();
        if (textHasBlockWord(blob)) return false;
        return textHasAge4Word(blob);
      }

      function normalizeList(list) {
        var out = [];
        var seen = {};
        (list || []).forEach(function (item) {
          var url = typeof item === 'string' ? item : (item && item.url);
          var title = typeof item === 'object' && item ? item.title : '';
          var channel = typeof item === 'object' && item ? item.channel : '';
          if (!url) return;
          url = String(url).trim();
          var id = extractVideoId(url);
          if (!id || seen[id]) return;
          seen[id] = true;
          out.push({ id: id, url: url, title: title || '', channel: channel || '' });
        });
        return out;
      }

      function loadFromHash() {
        if (location.hash.indexOf(HASH_PREFIX) !== 0) return [];
        try {
          return normalizeList(location.hash.slice(HASH_PREFIX.length).split('~').map(decodeURIComponent));
        } catch (e) { return []; }
      }

      function updateHash() {
        if (!videos.length) {
          history.replaceState(null, '', location.pathname + location.search);
          return;
        }
        history.replaceState(null, '', HASH_PREFIX + videos.map(function (v) {
          return encodeURIComponent(v.url);
        }).join('~'));
      }

      function persistVideos() {
        if (savedStore) savedStore.value = videos.map(function (v) { return v.url; }).join('\n');
        updateHash();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(videos)); } catch (e) {}
      }

      function loadVideos() {
        var merged = [];
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) merged = merged.concat(JSON.parse(raw));
        } catch (e) {}
        merged = merged.concat(loadFromHash());
        if (savedStore && savedStore.value.trim()) {
          merged = merged.concat(savedStore.value.split('\n'));
        }
        videos = normalizeList(merged);
        if (videos.length) persistVideos();
      }

      function pageOrigin() {
        return (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin : '';
      }

      function embedUrl(id) {
        var p = ['autoplay=1', 'playsinline=1', 'rel=0', 'modestbranding=1', 'enablejsapi=1', 'fs=1'];
        var o = pageOrigin();
        if (o) p.push('origin=' + encodeURIComponent(o));
        return 'https://www.youtube.com/embed/' + id + '?' + p.join('&');
      }

      function destroyPlayer() {
        var iframe = playerSlot.querySelector('iframe');
        if (iframe) {
          try {
            iframe.contentWindow.postMessage('{"event":"command","func":"stopVideo","args":""}', '*');
          } catch (_) {}
          iframe.src = 'about:blank';
        }
        playerSlot.innerHTML = '';
        placeholder.style.display = 'flex';
        if (nowRow) nowRow.classList.remove('visible');
        playerWrap.classList.remove('is-short');
        nowPlaying.innerHTML = '&nbsp;';
        currentId = null;
        playerError.hidden = true;
      }

      function playItem(item, label) {
        if (isFilePage) {
          playerError.textContent = 'Open via GitHub Pages / https link — not saved file.';
          playerError.hidden = false;
          return;
        }
        if (currentId === item.id && playerSlot.querySelector('iframe')) {
          destroyPlayer();
          renderSaved();
          renderSearch();
          return;
        }
        destroyPlayer();
        currentId = item.id;
        playerWrap.classList.toggle('is-short', isShortUrl(item.url));
        nowPlaying.textContent = label || item.title || 'Playing';
        if (nowRow) nowRow.classList.add('visible');
        renderSaved();
        renderSearch();

        var iframe = document.createElement('iframe');
        iframe.title = 'Player';
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        iframe.src = embedUrl(item.id);
        placeholder.style.display = 'none';
        playerSlot.appendChild(iframe);
      }

      function makeItemEl(item, idx, opts) {
        opts = opts || {};
        var el = document.createElement('div');
        el.className = 'video-item' + (item.id === currentId ? ' active' : '');

        var img = document.createElement('img');
        img.className = 'thumb';
        img.src = item.thumb || ('https://img.youtube.com/vi/' + item.id + '/mqdefault.jpg');
        img.alt = '';
        img.loading = 'lazy';

        var info = document.createElement('div');
        info.className = 'info';
        var t = document.createElement('div');
        t.className = 'title';
        t.textContent = item.title || ((isShortUrl(item.url) ? 'Short ' : 'Video ') + (idx + 1));
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = item.channel || (opts.search ? 'Tap to play' : 'Saved');
        info.appendChild(t);
        info.appendChild(meta);

        el.appendChild(img);
        el.appendChild(info);

        if (opts.showAdd) {
          var add = document.createElement('button');
          add.type = 'button';
          add.className = 'btn-add';
          add.textContent = '+ Save';
          add.addEventListener('click', function (e) {
            e.stopPropagation();
            addToSaved(item);
          });
          el.appendChild(add);
        }

        if (opts.showDel) {
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'btn-del';
          del.textContent = 'Delete';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            removeVideo(idx);
          });
          el.appendChild(del);
        }

        el.addEventListener('click', function () {
          playItem(item, t.textContent);
        });
        return el;
      }

      function renderSaved() {
        countEl.textContent = String(videos.length);
        videoList.innerHTML = '';
        emptyState.hidden = videos.length > 0;
        videos.forEach(function (v, i) {
          videoList.appendChild(makeItemEl(v, i, { showDel: true }));
        });
      }

      function renderSearch() {
        searchList.innerHTML = '';
        searchEmpty.hidden = searchResults.length > 0;
        searchResults.forEach(function (v, i) {
          searchList.appendChild(makeItemEl(v, i, { search: true, showAdd: true }));
        });
      }

      function addToSaved(item, skipFilter) {
        if (videos.some(function (v) { return v.id === item.id; })) {
          searchMsg.className = 'msg info';
          searchMsg.textContent = 'Already in My saved videos.';
          return;
        }
        if (!skipFilter && !isEducationVideo(item)) {
          searchMsg.className = 'msg err';
          searchMsg.textContent = 'Not education-related. Parent can add manually.';
          return;
        }
        videos.push({
          id: item.id,
          url: item.url,
          title: item.title || '',
          channel: item.channel || ''
        });
        persistVideos();
        renderSaved();
        searchMsg.className = 'msg ok';
        searchMsg.textContent = 'Saved to My videos!';
      }

      function removeVideo(idx) {
        if (videos[idx] && videos[idx].id === currentId) destroyPlayer();
        videos.splice(idx, 1);
        persistVideos();
        renderSaved();
      }

      function fetchOEmbed(url) {
        return fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(url) + '&format=json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }

      function searchYouTube(query) {
        var key = getApiKey();
        if (!key) {
          searchMsg.className = 'msg err';
          searchMsg.textContent = 'Parent: add YouTube API key in ⚙️ settings (free, one-time).';
          return Promise.resolve([]);
        }
        var q = query.trim() + ' ' + SEARCH_SUFFIX;
        var url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&safeSearch=strict'
          + '&videoCategoryId=27&videoDuration=short&maxResults=25&q=' + encodeURIComponent(q)
          + '&key=' + encodeURIComponent(key);

        return fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.error) throw new Error(data.error.message || 'API error');
            return (data.items || []).map(function (it) {
              var id = it.id && it.id.videoId;
              var sn = it.snippet || {};
              return {
                id: id,
                url: 'https://www.youtube.com/watch?v=' + id,
                title: sn.title || '',
                channel: sn.channelTitle || '',
                description: sn.description || '',
                thumb: sn.thumbnails && sn.thumbnails.medium ? sn.thumbnails.medium.url : ''
              };
            }).filter(function (v) { return v.id && isEducationVideo(v); });
          });
      }

      function doSearch(q) {
        searchMsg.className = 'msg info';
        searchMsg.textContent = 'Searching education videos…';
        searchBtn.disabled = true;
        searchYouTube(q).then(function (results) {
          searchResults = results;
          renderSearch();
          if (!results.length) {
            searchMsg.className = 'msg err';
            searchMsg.textContent = 'Nothing for age 4. Try: ABC, colours, farm animals…';
          } else {
            searchMsg.className = 'msg ok';
            searchMsg.textContent = results.length + ' age-4 video(s) found.';
          }
        }).catch(function (err) {
          searchMsg.className = 'msg err';
          searchMsg.textContent = String(err.message || err);
        }).finally(function () {
          searchBtn.disabled = false;
        });
      }

      function parentAddUrl() {
        addMsg.className = 'msg';
        var url = urlInput.value.trim();
        var id = extractVideoId(url);
        if (!id) {
          addMsg.className = 'msg err';
          addMsg.textContent = 'Invalid YouTube link.';
          return;
        }
        fetchOEmbed(url).then(function (o) {
          addToSaved({
            id: id,
            url: url,
            title: o ? o.title : '',
            channel: o ? o.author_name : ''
          }, true);
          urlInput.value = '';
          addMsg.className = 'msg ok';
          addMsg.textContent = 'Added (parent override).';
        });
      }

      QUICK_SEARCH.forEach(function (item) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = item.label;
        b.addEventListener('click', function () {
          searchInput.value = item.q;
          doSearch(item.q);
        });
        chipRow.appendChild(b);
      });

      parentBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        parentPanel.scrollIntoView({ behavior: 'smooth' });
      });

      pinBtn.addEventListener('click', function () {
        if (pinInput.value === getPin()) {
          pinGate.style.display = 'none';
          parentBody.classList.add('open');
          apiKeyInput.value = getApiKey();
        } else {
          addMsg.className = 'msg err';
          addMsg.textContent = 'Wrong PIN.';
        }
      });

      saveKeyBtn.addEventListener('click', saveApiKey);
      saveBtn.addEventListener('click', parentAddUrl);
      searchBtn.addEventListener('click', function () { doSearch(searchInput.value); });
      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doSearch(searchInput.value);
      });
      stopBtn.addEventListener('click', function () {
        destroyPlayer();
        renderSaved();
        renderSearch();
      });

      window.addEventListener('pagehide', destroyPlayer);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) destroyPlayer();
      });

      apiKeyInput.value = getApiKey();
      loadVideos();
      renderSaved();
      renderSearch();
    })();
  </script>
</body>
</html>
